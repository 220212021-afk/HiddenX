repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: python -m ruff check --fix
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format
        language: system
        types: [python]
        files: ^backend/
      - id: mypy
        name: mypy
        entry: python -m mypy --config-file backend/pyproject.toml backend/app
        language: system
        pass_filenames: false
        types: [python]
        files: ^backend/.*\.py$
