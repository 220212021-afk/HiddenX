[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiddenx-backend"
version = "0.1.0"
description = "Hidden X API backend"
requires-python = ">=3.10"
dependencies = [
    "alembic",
    "argon2-cffi",
    "asyncpg",
    "cryptography",
    "email-validator",
    "fastapi",
    "pydantic-settings",
    "PyJWT",
    "python-dotenv",
    "SQLAlchemy",
    "uvicorn[standard]",
]

[project.optional-dependencies]
test = [
    "httpx",
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
